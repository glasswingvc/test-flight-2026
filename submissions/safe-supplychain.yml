# One or two sentences, 280 characters max. What it does and for whom.
description: "Every coding agent is an unreviewed install decision, dozens of times a day per engineer. safe-supplychain sits in the agent's loop, judges each software package before install, and gives AppSec the record. SCA checks CI; we check at runtime."

# Who inside a company would use this.
customer: "The CISO or Head of Application Security at a mid-to-large engineering organization that has rolled out coding agents. Bought from the AppSec / software supply chain security budget that today funds SCA and SBOM management and tooling"

